name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - next
      # maintenance branches, e.g. 1.x / 1.2.x (see release.branches)
      - "*.x"

jobs:
  checks:
    name: Lint, Test & Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
        env:
          GITHUB_OWNER: owner-nock-mocked
          GITHUB_REPO: repo-nock-mocked
          GITHUB_TOKEN: token-nock-mocked
      - run: npm run build

  release:
    name: Release
    # release only from pushes to release branches, after all checks pass;
    # semantic-release's own branches config decides the version/channel
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run semantic-release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # same as GH token since we're using the GH npm repo.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
